<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f7f8">
<title>청약 일정</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--text:#202124;--muted:#85858d;--line:#e8e8ec;--accent:#222;--danger:#e45757}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input{font:inherit} button{border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 4px 14px}
h1{font-size:24px;margin:0;font-weight:750}.add{background:#222;color:white;border-radius:13px;padding:10px 14px;font-weight:650}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 2px 12px #00000008;margin-bottom:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 13px}
.month{font-size:18px;font-weight:750}.nav{display:flex;gap:4px}.nav button{width:34px;height:34px;border-radius:10px;background:#f3f3f5;font-size:18px}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;font-size:11px;color:#999;padding-bottom:8px}
.day{min-width:0;min-height:78px;border-top:1px solid var(--line);padding:6px 2px 3px;position:relative}
.day .num{font-size:12px;color:#555;display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center}
.day.today .num{background:#222;color:#fff;border-radius:50%;font-weight:700}.day.other{opacity:.32}
.event{display:block;width:100%;margin-top:3px;padding:3px 4px;border-radius:6px;color:#222;font-size:10px;line-height:1.2;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;padding:0 3px}.legend span{font-size:11px;color:#666;display:flex;align-items:center;gap:4px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.empty{text-align:center;color:#999;padding:38px 10px;font-size:14px}
.list-title{font-size:15px;font-weight:750;margin:3px 2px 10px}.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .info{min-width:0;flex:1}.row .name{font-size:14px;font-weight:700}.row .sub{font-size:11px;color:#888;margin-top:3px}
.dot.big{width:10px;height:10px;flex:none}.badge{font-size:10px;background:#f0f0f2;padding:4px 7px;border-radius:8px;color:#666}
dialog{border:0;border-radius:24px;width:min(94%,520px);padding:0;box-shadow:0 20px 60px #0003}dialog::backdrop{background:#0005}
.form{padding:22px}.form h2{margin:0 0 18px;font-size:20px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#777;margin:0 0 6px}.field input{width:100%;border:1px solid #dddde2;border-radius:11px;padding:11px 12px;background:#fafafa}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.colors{display:flex;gap:8px;flex-wrap:wrap}.color{width:28px;height:28px;border-radius:50%;border:2px solid transparent}.color.sel{border-color:#222;outline:2px solid white;box-shadow:0 0 0 1px #222}
.actions{display:flex;gap:8px;margin-top:20px}.actions button{flex:1;padding:12px;border-radius:12px;font-weight:700}.cancel{background:#f0f0f2}.save{background:#222;color:#fff}.delete{background:#fff0f0;color:#d33}
.detail{padding:22px}.detail h2{margin:0 0 4px}.detail .date{font-size:12px;color:#888}.result{margin:15px 0;padding:13px;background:#f7f7f8;border-radius:14px}.result-title{font-size:12px;font-weight:700;margin-bottom:8px}.result-buttons{display:flex;gap:8px}.result-buttons button{flex:1;border:1px solid #ddd;border-radius:10px;padding:9px;background:white}.result-buttons button.selected{background:#222;color:#fff;border-color:#222}.eventline{display:flex;gap:9px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.eventline .mark{width:8px;height:8px;border-radius:50%;margin-top:5px}.eventline b{font-size:13px}.eventline small{display:block;color:#888;margin-top:2px}.notice{font-size:11px;color:#888;line-height:1.5;margin-top:12px}
@media (max-width:390px){.day{min-height:70px}.event{font-size:9px}.app{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div class="app">
<header><h1>🏠 청약 일정</h1><button class="add" id="addBtn">＋ 청약</button></header>
<section class="card">
  <div class="cal-head"><div class="month" id="monthTitle"></div><div class="nav"><button id="prev">‹</button><button id="today">오늘</button><button id="next">›</button></div></div>
  <div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
  <div class="days" id="days"></div>
  <div class="legend" id="legend"></div>
</section>
<section class="card"><div class="list-title">내 청약</div><div id="list"></div></section>
</div>

<dialog id="formDialog">
<form class="form" id="form">
<h2 id="formTitle">청약 추가</h2>
<input type="hidden" id="editId">
<div class="field"><label>청약 공고 이름 *</label><input id="name" required placeholder="예: 2026년 청년 매입임대"></div>
<div class="two">
<div class="field"><label>서류 발표일</label><input id="docDate" type="date"></div>
<div class="field"><label>당첨자 발표일</label><input id="winDate" type="date"></div>
</div>
<div class="two">
<div class="field"><label>입주 시작일</label><input id="moveStart" type="date"></div>
<div class="field"><label>입주 종료일 (선택)</label><input id="moveEnd" type="date"></div>
</div>
<div class="field"><label>색상</label><div class="colors" id="colors"></div></div>
<div class="actions"><button type="button" class="cancel" id="cancel">취소</button><button class="save">저장</button></div>
</form>
</dialog>

<dialog id="detailDialog"><div class="detail" id="detail"></div></dialog>

<script>
const COLORS=["#b9a1ff","#75c7a8","#78aeea","#f3b36a","#ed91ae","#8fc7cf","#b5b5b5","#d59bd0"];
let data=JSON.parse(localStorage.getItem("myHousingApps")||"[]");
let view=new Date(); view.setDate(1);
let selectedColor=COLORS[0];

const $=s=>document.querySelector(s);
const save=()=>localStorage.setItem("myHousingApps",JSON.stringify(data));
const fmt=d=>{if(!d)return "";let [y,m,day]=d.split("-");return `${y}.${m}.${day}`};
const dateKey=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const activeEvents=a=>{
 let ev=[];
 if(a.docDate) ev.push({date:a.docDate,name:a.name+" · 서류발표",type:"doc",a});
 if(a.winDate && a.docResult!=="fail") ev.push({date:a.winDate,name:a.name+" · 당첨발표",type:"win",a});
 if(a.moveStart && a.winResult!=="fail" && a.docResult!=="fail"){
   let end=a.moveEnd||a.moveStart;
   let cur=new Date(a.moveStart+"T00:00:00"), last=new Date(end+"T00:00:00");
   while(cur<=last){ev.push({date:cur.toISOString().slice(0,10),name:a.name+" · 입주",type:"move",a});cur.setDate(cur.getDate()+1)}
 }
 return ev;
};
function render(){
 const y=view.getFullYear(),m=view.getMonth();
 $("#monthTitle").textContent=`${y}년 ${m+1}월`;
 const first=new Date(y,m,1).getDay(), last=new Date(y,m+1,0).getDate();
 let html="";
 const prevLast=new Date(y,m,0).getDate();
 for(let i=0;i<first;i++) html+=`<div class="day other"><span class="num">${prevLast-first+i+1}</span></div>`;
 const today=new Date(); const todayK=dateKey(today.getFullYear(),today.getMonth(),today.getDate());
 for(let d=1;d<=last;d++){
   const k=dateKey(y,m,d);
   const ev=data.flatMap(activeEvents).filter(e=>e.date===k);
   html+=`<div class="day ${k===todayK?"today":""}" data-date="${k}"><span class="num">${d}</span>${ev.slice(0,4).map(e=>`<button class="event" style="background:${e.a.color}22;border-left:3px solid ${e.a.color}" data-id="${e.a.id}">${e.name}</button>`).join("")}${ev.length>4?`<small>+${ev.length-4}</small>`:""}</div>`;
 }
 const cells=first+last; for(let i=0;i<(7-cells%7)%7;i++) html+=`<div class="day other"><span class="num">${i+1}</span></div>`;
 $("#days").innerHTML=html;
 document.querySelectorAll(".event").forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
 const used=[...new Map(data.map(a=>[a.id,a])).values()];
 $("#legend").innerHTML=used.map(a=>`<span><i class="dot" style="background:${a.color}"></i>${a.name}</span>`).join("");
 renderList();
}
function renderList(){
 const el=$("#list");
 if(!data.length){el.innerHTML='<div class="empty">아직 등록한 청약이 없어요.<br>위의 ＋ 청약 버튼으로 추가해보세요.</div>';return}
 el.innerHTML=data.map(a=>{
   let status=a.winResult==="fail"||a.docResult==="fail"?"불합격":a.winResult==="pass"?"당첨":a.docResult==="pass"?"서류 합격":"진행중";
   return `<button class="row" style="width:100%;text-align:left" data-id="${a.id}"><i class="dot big" style="background:${a.color}"></i><div class="info"><div class="name">${a.name}</div><div class="sub">${a.docDate?"서류 "+fmt(a.docDate):""}${a.winDate?" · 당첨 "+fmt(a.winDate):""}</div></div><span class="badge">${status}</span></button>`
 }).join("");
 document.querySelectorAll(".row").forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
}
function openForm(id=null){
 const a=id?data.find(x=>x.id===id):null;
 $("#formTitle").textContent=a?"청약 수정":"청약 추가";
 $("#editId").value=a?.id||"";$("#name").value=a?.name||"";
 $("#docDate").value=a?.docDate||"";$("#winDate").value=a?.winDate||"";
 $("#moveStart").value=a?.moveStart||"";$("#moveEnd").value=a?.moveEnd||"";
 selectedColor=a?.color||COLORS[data.length%COLORS.length];
 $("#colors").innerHTML=COLORS.map(c=>`<button type="button" class="color ${c===selectedColor?"sel":""}" style="background:${c}" data-color="${c}"></button>`).join("");
 document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{selectedColor=b.dataset.color;document.querySelectorAll(".color").forEach(x=>x.classList.toggle("sel",x.dataset.color===selectedColor))});
 $("#formDialog").showModal();
}
$("#form").onsubmit=e=>{
 e.preventDefault();
 const id=$("#editId").value||crypto.randomUUID();
 const old=data.find(x=>x.id===id);
 const a={id,name:$("#name").value.trim(),docDate:$("#docDate").value,winDate:$("#winDate").value,moveStart:$("#moveStart").value,moveEnd:$("#moveEnd").value,color:selectedColor,docResult:old?.docResult||null,winResult:old?.winResult||null};
 if(old) Object.assign(old,a); else data.push(a); save();$("#formDialog").close();render();
};
$("#cancel").onclick=()=>$("#formDialog").close();
$("#addBtn").onclick=()=>openForm();
$("#prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$("#next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$("#today").onclick=()=>{view=new Date();view.setDate(1);render()};

function openDetail(id){
 const a=data.find(x=>x.id===id); if(!a)return;
 const ev=[];
 if(a.docDate)ev.push(["서류 발표",a.docDate,"doc"]);
 if(a.winDate && a.docResult!=="fail")ev.push(["당첨자 발표",a.winDate,"win"]);
 if(a.moveStart && a.docResult!=="fail" && a.winResult!=="fail")ev.push(["입주 일정",a.moveStart+(a.moveEnd?" ~ "+a.moveEnd:""),"move"]);
 $("#detail").innerHTML=`<button onclick="$('#detailDialog').close()" style="float:right;font-size:24px">×</button>
 <h2><i class="dot big" style="display:inline-block;background:${a.color}"></i> ${a.name}</h2>
 <div class="date">${a.docDate?"서류 발표 "+fmt(a.docDate):"서류 발표 일정 없음"}${a.winDate?" · 당첨 발표 "+fmt(a.winDate):""}</div>
 ${a.docDate?`<div class="result"><div class="result-title">서류 발표 결과</div><div class="result-buttons"><button class="${a.docResult==="pass"?"selected":""}" onclick="setResult('${a.id}','doc','pass')">⭕ 합격</button><button class="${a.docResult==="fail"?"selected":""}" onclick="setResult('${a.id}','doc','fail')">❌ 불합격</button></div></div>`:""}
 ${a.winDate&&a.docResult!=="fail"?`<div class="result"><div class="result-title">당첨자 발표 결과</div><div class="result-buttons"><button class="${a.winResult==="pass"?"selected":""}" onclick="setResult('${a.id}','win','pass')">⭕ 당첨</button><button class="${a.winResult==="fail"?"selected":""}" onclick="setResult('${a.id}','win','fail')">❌ 불합격</button></div></div>`:""}
 <div style="margin-top:10px">${ev.map(e=>`<div class="eventline"><i class="mark" style="background:${a.color}"></i><div><b>${e[0]}</b><small>${e[1] instanceof Date?e[1]:fmt(e[1].split(" ~ ")[0])+(e[1].includes(" ~ ")? " ~ "+fmt(e[1].split(" ~ ")[1]):"")}</small></div></div>`).join("")}</div>
 <div class="notice">불합격을 선택하면 그 이후 단계의 일정은 달력에서 자동으로 숨겨집니다.</div>
 <div class="actions"><button class="cancel" onclick="openForm('${a.id}');$('#detailDialog').close()">수정</button><button class="delete" onclick="removeApp('${a.id}')">삭제</button></div>`;
 $("#detailDialog").showModal();
}
window.setResult=(id,type,result)=>{
 const a=data.find(x=>x.id===id); if(!a)return;
 if(type==="doc") a.docResult=result; else a.winResult=result;
 save(); openDetail(id); render();
};
window.removeApp=id=>{if(confirm("이 청약을 삭제할까요?")){data=data.filter(x=>x.id!==id);save();$("#detailDialog").close();render()}};
render();
</script>
</body>
</html>
