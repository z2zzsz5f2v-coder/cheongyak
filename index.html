<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f7f8">
<title>청약 일정</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--text:#202124;--muted:#85858d;--line:#e8e8ec;--accent:#222;--danger:#e45757}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input{font:inherit} button{border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 4px 12px}
h1{font-size:24px;margin:0;font-weight:750}.add{background:#222;color:white;border-radius:13px;padding:10px 14px;font-weight:650}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 2px 12px #00000008;margin-bottom:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 13px}.month{font-size:18px;font-weight:750}.nav{display:flex;gap:4px}.nav button{width:34px;height:34px;border-radius:10px;background:#f3f3f5;font-size:18px}.nav #today{width:58px;white-space:nowrap;font-size:14px;font-weight:750}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;font-size:11px;color:#555862;padding-bottom:8px;font-weight:700}
.days{display:block}.week-row{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:96px;border-top:1px solid var(--line)}
.day{min-width:0;min-height:96px;padding:6px 2px 4px;position:relative;z-index:2}.day .num{font-size:12px;color:#303038;display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;font-weight:650}.day.today .num{background:#222;color:#fff;border-radius:50%;font-weight:700}.day.other{opacity:.32}
.point-events{display:flex;flex-direction:column;gap:2px}.event{display:block;width:100%;margin-top:3px;padding:4px 4px;border-radius:6px;color:#202124;font-size:10px;line-height:1.2;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:750;box-sizing:border-box}.event.stage-doc{background:color-mix(in srgb,var(--event-color) 28%,transparent);border-left:3px solid var(--event-color)}.event.stage-win{background:color-mix(in srgb,var(--event-color) 48%,transparent);border-left:3px solid var(--event-color)}
.move-layer{position:absolute;left:0;right:0;top:33px;height:20px;z-index:4;pointer-events:none}.move-bar{position:absolute;height:20px;top:0;padding:4px 4px;color:#202124;font-size:10px;line-height:1.2;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--event-color) 64%,transparent);border:0;border-radius:6px;box-sizing:border-box;pointer-events:auto;cursor:pointer}.move-bar.start,.move-bar.end,.move-bar.single{border-radius:6px}.move-bar.start::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--event-color);border-radius:6px 0 0 6px}.move-bar.start{padding-left:7px}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;padding:0 3px}.legend span{font-size:11px;color:#666;display:flex;align-items:center;gap:4px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.empty{text-align:center;color:#999;padding:38px 10px;font-size:14px}.list-title{font-size:15px;font-weight:800;margin:3px 2px 10px}.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row .info{min-width:0;flex:1}.row .name{font-size:14px;font-weight:800;color:#25262b}.row .sub{font-size:11px;color:#888;margin-top:3px}.dot.big{width:10px;height:10px;flex:none}.badge{font-size:10px;background:#f0f0f2;padding:4px 7px;border-radius:8px;color:#444;font-weight:700}
dialog{border:0;border-radius:24px;width:min(94%,520px);padding:0;box-shadow:0 20px 60px #0003}dialog::backdrop{background:#0005}.form{padding:22px}.form h2{margin:0 0 18px;font-size:20px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#777;margin:0 0 6px}.field input{width:100%;border:1px solid #dddde2;border-radius:11px;padding:11px 12px;background:#fafafa}.field input[type=file]{padding:9px;background:#fff}.helper{font-size:10px;color:#999;margin-top:5px;line-height:1.4}.link-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.link-chip{display:inline-flex;align-items:center;padding:6px 9px;border-radius:9px;background:#f3f3f5;color:#333;font-size:11px;font-weight:750;text-decoration:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.colors{display:flex;gap:8px;flex-wrap:wrap}.color{width:28px;height:28px;border-radius:50%;border:2px solid transparent}.color.sel{border-color:#222;outline:2px solid white;box-shadow:0 0 0 1px #222}.actions{display:flex;gap:8px;margin-top:20px}.actions button{flex:1;padding:12px;border-radius:12px;font-weight:700}.cancel{background:#f0f0f2}.save{background:#222;color:#fff}.delete{background:#fff0f0;color:#d33}
.detail{padding:22px}.detail h2{margin:0 0 4px}.detail .date{font-size:12px;color:#888}.result{margin:15px 0;padding:13px;background:#f7f7f8;border-radius:14px}.result-title{font-size:12px;font-weight:700;margin-bottom:8px}.result-buttons{display:flex;gap:8px}.result-buttons button{flex:1;border:1px solid #ddd;border-radius:10px;padding:9px;background:white}.result-buttons button.selected{background:#222;color:#fff;border-color:#222}.eventline{display:flex;gap:9px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.eventline .mark{width:8px;height:8px;border-radius:50%;margin-top:5px}.eventline b{font-size:13px}.eventline small{display:block;color:#888;margin-top:2px}.notice{font-size:11px;color:#888;line-height:1.5;margin-top:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#ededf0;border-radius:12px;padding:3px;margin:0 0 14px}.tab{padding:9px;border-radius:10px;font-size:13px;font-weight:750;color:#777}.tab.active{background:#fff;color:#222;box-shadow:0 1px 5px #0000000d}.page{display:none}.page.active{display:block}.overview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.overview-count{font-size:12px;color:#888}.overview-row{display:flex;align-items:center;gap:10px;padding:13px 4px;border-top:1px solid var(--line)}.overview-row:first-of-type{border-top:0}.overview-main{min-width:0;flex:1}.overview-name{font-size:14px;font-weight:800;color:#25262b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.overview-status{font-size:11px;color:#666;margin-top:4px}.overview-dday{font-size:11px;font-weight:800;color:#555;background:#f2f2f4;border-radius:9px;padding:5px 8px;white-space:nowrap}.detail-dday{display:inline-block;margin-top:6px;padding:5px 9px;border-radius:9px;background:#f1f1f3;color:#333;font-size:12px;font-weight:800}.eventline small{font-weight:600;color:#777}
@media (max-width:390px){.day,.week-row{min-height:88px}.event{font-size:9px}.move-layer{top:31px;height:19px}.app{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div class="app">
<header><h1>🏠 청약 일정</h1><button class="add" id="addBtn">＋ 청약</button></header>
<div class="tabs"><button class="tab active" id="calendarTab">달력</button><button class="tab" id="overviewTab">전체 청약</button></div>
<div class="page active" id="calendarPage">
<section class="card">
  <div class="cal-head"><div class="month" id="monthTitle"></div><div class="nav"><button id="prev">‹</button><button id="today">오늘</button><button id="next">›</button></div></div>
  <div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
  <div class="days" id="days"></div>
  <div class="legend" id="legend"></div>
</section>
<section class="card"><div class="list-title">내 청약</div><div id="list"></div></section>
</div>
<div class="page" id="overviewPage">
<section class="card">
  <div class="overview-head"><div class="list-title" style="margin:3px 2px 0">전체 청약</div><div class="overview-count" id="overviewCount"></div></div>
  <div id="overviewList"></div>
</section>
</div>
</div>

<dialog id="formDialog">
<form class="form" id="form">
<h2 id="formTitle">청약 추가</h2>
<input type="hidden" id="editId">
<div class="field"><label>청약 공고 이름 *</label><input id="name" required placeholder="예: 2026년 청년 매입임대"></div>
<div class="two">
<div class="field"><label>서류 발표일</label><input id="docDate" type="date"></div>
<div class="field"><label>당첨자 발표일</label><input id="winDate" type="date"></div>
</div>
<div class="two">
<div class="field"><label>입주 시작일</label><input id="moveStart" type="date"></div>
<div class="field"><label>입주 종료일 (선택)</label><input id="moveEnd" type="date"></div>
</div>
<div class="field"><label>청약 공고 링크 (선택)</label><input id="noticeUrl" type="url" placeholder="https://..."></div>
<div class="field"><label>청약 공고 PDF (선택)</label><input id="noticePdf" type="file" accept="application/pdf"><div class="helper" id="pdfStatus">공고문이 없어도 등록할 수 있어요.</div></div>
<div class="field"><label>위치 주소 (선택)</label><input id="address" type="text" placeholder="예: 서울특별시 강서구 ..."><div class="helper">등록 후 주소를 누르면 네이버지도로 이동해요.</div></div>
<div class="field"><label>색상</label><div class="colors" id="colors"></div></div>
<div class="actions"><button type="button" class="cancel" id="cancel">취소</button><button class="save">저장</button></div>
</form>
</dialog>

<dialog id="detailDialog"><div class="detail" id="detail"></div></dialog>

<script>
function openNaverMap(address){
 const appUrl='nmap://search?query='+encodeURIComponent(address);
 const webUrl='https://map.naver.com/p/search/'+encodeURIComponent(address);
 let hidden=false;
 const onHide=()=>{hidden=true;document.removeEventListener('visibilitychange',onHide)};
 document.addEventListener('visibilitychange',onHide);
 window.location.href=appUrl;
 setTimeout(()=>{document.removeEventListener('visibilitychange',onHide);if(!hidden)window.open(webUrl,'_blank')},900);
}
const OLD_COLORS=["#A78BFA","#6FCF97","#64B5F6","#FFB870","#F38BAA","#59C7C0","#E3C15A","#C084FC"];
const COLORS=["#A7DDE6","#F6B3B7","#F2A5C0","#F6C1D0","#C69BD7","#B09ADE","#A8B4E2","#9FCBEA","#9AD6D4","#A9D6A5","#A8DEC3","#F5E49A","#FFD0A3","#FFB6A5","#C7AAA0","#D2D2D2"];
let data=JSON.parse(localStorage.getItem("myHousingApps")||"[]");
// 기존 청약도 새 파스텔 팔레트로 자연스럽게 교체
data=data.map(a=>{const i=OLD_COLORS.indexOf(a.color);return i>=0?{...a,color:COLORS[i]}:a;});
if(data.length) localStorage.setItem("myHousingApps",JSON.stringify(data));
let view=new Date(); view.setDate(1);
let selectedColor=COLORS[0];

const $=s=>document.querySelector(s);
const save=()=>localStorage.setItem("myHousingApps",JSON.stringify(data));
const fmt=d=>{if(!d)return "";let [y,m,day]=d.split("-");return `${y}.${m}.${day}`};
const dateKey=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const dateObj=s=>s?new Date(s+"T00:00:00"):null;
const daysFromToday=s=>{if(!s)return null;const a=dateObj(s),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/86400000)};
const dday=s=>{const n=daysFromToday(s);if(n===null)return "";if(n===0)return "D-Day";return n>0?`D-${n}`:`D+${Math.abs(n)}`};
const statusText=a=>{if(a.docResult==="fail")return "서류 불합격";if(a.winResult==="fail")return "당첨자 발표 불합격";if(a.winResult==="pass")return "당첨";if(a.docResult==="pass")return "서류 합격 · 당첨자 발표 대기중";return "진행중"};
const nextSchedule=a=>{const items=[];if(a.docDate && !a.docResult)items.push([a.docDate,"서류 발표"]);if(a.docDate && a.docResult==="pass" && a.winDate && !a.winResult)items.push([a.winDate,"당첨자 발표"]);if(a.moveStart && a.docResult==="pass" && a.winResult==="pass")items.push([a.moveStart,"입주 시작"]);if(!a.docResult && a.docDate)items.push([a.docDate,"서류 발표"]);if(a.docResult==="pass" && !a.winDate && a.moveStart)items.push([a.moveStart,"입주 시작"]);items.sort((x,y)=>x[0].localeCompare(y[0]));return items[0]||null};
const activePointEvents=a=>{
 let ev=[];
 if(a.docDate) ev.push({date:a.docDate,name:a.name+" · 서류발표",type:"doc",a});
 if(a.winDate && a.docResult!=="fail") ev.push({date:a.winDate,name:a.name+" · 당첨발표",type:"win",a});
 return ev;
};
const activeMove=a=>{
 if(!a.moveStart || a.winResult==="fail" || a.docResult==="fail") return null;
 const end=a.moveEnd||a.moveStart;
 return {start:a.moveStart,end, a};
};
const moveSegmentsForWeek=(move, weekStart)=>{
 const ws=dateObj(weekStart), we=new Date(ws); we.setDate(we.getDate()+6);
 const s=dateObj(move.start), e=dateObj(move.end);
 const from=s>ws?s:ws, to=e<we?e:we;
 if(from>to) return null;
 const startIdx=Math.round((from-ws)/86400000), endIdx=Math.round((to-ws)/86400000);
 return {startIdx,endIdx};
};
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");
function render(){
 const y=view.getFullYear(),m=view.getMonth();
 $("#monthTitle").textContent=`${y}년 ${m+1}월`;
 const first=new Date(y,m,1).getDay(), last=new Date(y,m+1,0).getDate();
 let html="";
 const prevLast=new Date(y,m,0).getDate();
 const total=first+last, weeks=Math.ceil(total/7);
 const today=new Date(); const todayK=dateKey(today.getFullYear(),today.getMonth(),today.getDate());
 const pointEvents=data.flatMap(activePointEvents);
 const moves=data.map(activeMove).filter(Boolean);

 for(let w=0;w<weeks;w++){
   const weekBase=w*7-first+1;
   const weekStartDate=new Date(y,m,weekBase);
   const weekStart=dateKey(weekStartDate.getFullYear(),weekStartDate.getMonth(),weekStartDate.getDate());

   // 입주 하이라이트의 줄(레이어)을 먼저 계산해, 그 아래에 일정 글씨가 오도록 한다.
   const segs=moves.map(move=>{
     const seg=moveSegmentsForWeek(move,weekStart);
     return seg?{...seg,move}:null;
   }).filter(Boolean);

   segs.sort((x,y)=>{
     const xd=x.move.a.docDate||"9999-99-99";
     const yd=y.move.a.docDate||"9999-99-99";
     return xd.localeCompare(yd)||x.move.a.name.localeCompare(y.move.a.name);
   });

   const lanes=[];
   segs.forEach(seg=>{
     let lane=0;
     while(lanes[lane]?.some(r=>!(seg.endIdx<r.startIdx||seg.startIdx>r.endIdx))) lane++;
     (lanes[lane]??=[]).push(seg);
     seg.lane=lane;
   });
   const moveLaneCount=lanes.length;

   let row=`<div class="week-row" style="--move-lanes:${moveLaneCount}">`;

   for(let col=0;col<7;col++){
     const dayNum=weekBase+col;
     if(dayNum<1){
       row+=`<div class="day other"><span class="num">${prevLast+dayNum}</span></div>`;
       continue;
     }
     if(dayNum>last){
       row+=`<div class="day other"><span class="num">${dayNum-last}</span></div>`;
       continue;
     }

     const k=dateKey(y,m,dayNum);
     let ev=pointEvents.filter(e=>e.date===k);
     ev.sort((a,b)=>{
       const da=a.a.docDate||"9999-99-99", db=b.a.docDate||"9999-99-99";
       return da.localeCompare(db)||a.a.name.localeCompare(b.a.name);
     });

     // 입주기간이 실제로 걸쳐 있는 날짜만 그 아래에 일정이 오도록 공간을 확보한다.
     // 같은 주의 다른 날짜에 입주기간이 있어도, 해당 날짜에 입주기간이 없으면 일정은 위에서부터 채운다.
     const colMoveLanes=segs.reduce((max,seg)=>{
       return (seg.startIdx<=col && col<=seg.endIdx) ? Math.max(max,seg.lane+1) : max;
     },0);
     const eventPad=colMoveLanes ? (colMoveLanes*20+4) : 0;
     row+=`<div class="day ${k===todayK?"today":""}" data-date="${k}">
       <span class="num">${dayNum}</span>
       <div class="point-events" style="${eventPad?`padding-top:${eventPad}px`:''}">
         ${ev.slice(0,4).map(e=>{
           const stage=e.type==='doc'?'stage-doc':'stage-win';
           return `<button class="event ${stage}" style="--event-color:${e.a.color}" data-id="${e.a.id}">${esc(e.name)}</button>`;
         }).join("")}${ev.length>4?`<small>+${ev.length-4}</small>`:""}
       </div>
     </div>`;
   }

   if(segs.length){
     row+=`<div class="move-layer">`;
     segs.forEach(seg=>{
       const left=(seg.startIdx/7)*100;
       const width=((seg.endIdx-seg.startIdx+1)/7)*100;
       const actualStartIdx=Math.round((dateObj(seg.move.start)-dateObj(weekStart))/86400000);
       const isStart=seg.startIdx===actualStartIdx;
       const cls=isStart?'start':'';
       const label=isStart?seg.move.a.name+" · 입주":"";
       row+=`<button class="move-bar ${cls}" style="--event-color:${seg.move.a.color};left:${left}%;width:${width}%;top:${seg.lane*20}px" data-id="${seg.move.a.id}">${esc(label)}</button>`;
     });
     row+=`</div>`;
   }

   row+=`</div>`;
   html+=row;
 }
 $("#days").innerHTML=html;
 document.querySelectorAll(".event,.move-bar").forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
 const used=[...new Map(data.map(a=>[a.id,a])).values()];
 $("#legend").innerHTML=used.map(a=>`<span><i class="dot" style="background:${a.color}"></i>${esc(a.name)}</span>`).join("");
 renderList();
}
function renderList(){
 const el=$("#list");
 if(!data.length){el.innerHTML='<div class="empty">아직 등록한 청약이 없어요.<br>위의 ＋ 청약 버튼으로 추가해보세요.</div>';renderOverview();return}
 el.innerHTML=data.map(a=>{
   const status=statusText(a);
   return `<button class="row" style="width:100%;text-align:left" data-id="${a.id}"><i class="dot big" style="background:${a.color}"></i><div class="info"><div class="name">${a.name}</div><div class="sub">${a.docDate?"서류 "+fmt(a.docDate):""}${a.winDate?" · 당첨 "+fmt(a.winDate):""}</div></div><span class="badge">${status}</span></button>`
 }).join("");
 document.querySelectorAll(".row").forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
 renderOverview();
}
function renderOverview(){
 const el=$("#overviewList");
 $("#overviewCount").textContent=`총 ${data.length}건`;
 if(!data.length){el.innerHTML='<div class="empty">등록한 청약이 없어요.</div>';return}
 el.innerHTML=data.map(a=>{
   const next=nextSchedule(a);
   const d=next?dday(next[0]):"";
   return `<button class="overview-row" style="width:100%;text-align:left" data-id="${a.id}"><i class="dot big" style="background:${a.color}"></i><div class="overview-main"><div class="overview-name">${a.name}</div><div class="overview-status">${statusText(a)}</div></div>${d?`<span class="overview-dday">${next[1]} ${d}</span>`:""}</button>`;
 }).join("");
 document.querySelectorAll(".overview-row").forEach(b=>b.onclick=()=>openDetail(b.dataset.id));
}
function openForm(id=null){
 const a=id?data.find(x=>x.id===id):null;
 $("#formTitle").textContent=a?"청약 수정":"청약 추가";
 $("#editId").value=a?.id||"";$("#name").value=a?.name||"";
 $("#docDate").value=a?.docDate||"";$("#winDate").value=a?.winDate||"";
 $("#moveStart").value=a?.moveStart||"";$("#moveEnd").value=a?.moveEnd||"";
 $("#noticeUrl").value=a?.noticeUrl||"";$("#address").value=a?.address||"";$("#noticePdf").value="";$("#pdfStatus").textContent=a?.pdfData?"기존 공고 PDF가 저장되어 있어요. 새 PDF를 선택하면 교체됩니다.":"공고문이 없어도 등록할 수 있어요.";
 selectedColor=a?.color||COLORS[data.length%COLORS.length];
 $("#colors").innerHTML=COLORS.map(c=>`<button type="button" class="color ${c===selectedColor?"sel":""}" style="background:${c}" data-color="${c}"></button>`).join("");
 document.querySelectorAll(".color").forEach(b=>b.onclick=()=>{selectedColor=b.dataset.color;document.querySelectorAll(".color").forEach(x=>x.classList.toggle("sel",x.dataset.color===selectedColor))});
 $("#formDialog").showModal();
}
$("#form").onsubmit=async e=>{
 e.preventDefault();
 const id=$("#editId").value||crypto.randomUUID();
 const old=data.find(x=>x.id===id);
 let pdfData=old?.pdfData||"";
 const file=$("#noticePdf").files[0];
 if(file){
   if(file.size>4*1024*1024){alert("PDF는 4MB 이하로 올려주세요.");return;}
   pdfData=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});
 }
 const a={id,name:$("#name").value.trim(),docDate:$("#docDate").value,winDate:$("#winDate").value,moveStart:$("#moveStart").value,moveEnd:$("#moveEnd").value,noticeUrl:$("#noticeUrl").value.trim(),pdfData,address:$("#address").value.trim(),color:selectedColor,docResult:old?.docResult||null,winResult:old?.winResult||null};
 if(old) Object.assign(old,a); else data.push(a); save();$("#formDialog").close();render();
};
$("#cancel").onclick=()=>$("#formDialog").close();
$("#addBtn").onclick=()=>openForm();
$("#prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$("#next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$("#today").onclick=()=>{view=new Date();view.setDate(1);render()};

function openDetail(id){
 const a=data.find(x=>x.id===id); if(!a)return;
 const ev=[];
 if(a.docDate)ev.push(["서류 발표",a.docDate,"doc"]);
 if(a.winDate && a.docResult!=="fail")ev.push(["당첨자 발표",a.winDate,"win"]);
 if(a.moveStart && a.docResult!=="fail" && a.winResult!=="fail")ev.push(["입주 일정",a.moveStart+(a.moveEnd?" ~ "+a.moveEnd:""),"move"]);
 $("#detail").innerHTML=`<button onclick="$('#detailDialog').close()" style="float:right;font-size:24px">×</button>
 <h2><i class="dot big" style="display:inline-block;background:${a.color}"></i> ${a.name}</h2>
 <div class="date">${a.docDate?"서류 발표 "+fmt(a.docDate):"서류 발표 일정 없음"}${a.winDate?" · 당첨 발표 "+fmt(a.winDate):""}</div>
 ${a.docDate?`<div class="result"><div class="result-title">서류 발표 결과</div><div class="result-buttons"><button class="${a.docResult==="pass"?"selected":""}" onclick="setResult('${a.id}','doc','pass')">⭕ 합격</button><button class="${a.docResult==="fail"?"selected":""}" onclick="setResult('${a.id}','doc','fail')">❌ 불합격</button></div></div>`:""}
 ${a.winDate&&a.docResult!=="fail"?`<div class="result"><div class="result-title">당첨자 발표 결과</div><div class="result-buttons"><button class="${a.winResult==="pass"?"selected":""}" onclick="setResult('${a.id}','win','pass')">⭕ 당첨</button><button class="${a.winResult==="fail"?"selected":""}" onclick="setResult('${a.id}','win','fail')">❌ 불합격</button></div></div>`:""}
 <div style="margin-top:10px">${ev.map(e=>{const first=e[1].split(" ~ ")[0]; const dd=dday(first); return `<div class="eventline"><i class="mark" style="background:${a.color}"></i><div><b>${e[0]}</b><small>${fmt(first)}${e[1].includes(" ~ ")?" ~ "+fmt(e[1].split(" ~ ")[1]):""}${dd?` <span class="detail-dday">${dd}</span>`:""}</small></div></div>`}).join("")}</div>
 ${a.address||a.noticeUrl||a.pdfData?`<div class="link-row">${a.address?`<a class="link-chip" href="#" onclick='openNaverMap(${JSON.stringify(a.address)});return false;'>📍 ${a.address}</a>`:""}${a.noticeUrl?`<a class="link-chip" href="${a.noticeUrl}" target="_blank" rel="noopener">🔗 공고 링크</a>`:""}${a.pdfData?`<a class="link-chip" href="${a.pdfData}" target="_blank" rel="noopener">📄 공고 PDF</a>`:""}</div>`:""}
 <div class="notice">불합격을 선택하면 그 이후 단계의 일정은 달력에서 자동으로 숨겨집니다.</div>
 <div class="actions"><button class="cancel" onclick="openForm('${a.id}');$('#detailDialog').close()">수정</button><button class="delete" onclick="removeApp('${a.id}')">삭제</button></div>`;
 $("#detailDialog").showModal();
}
window.setResult=(id,type,result)=>{
 const a=data.find(x=>x.id===id); if(!a)return;
 if(type==="doc") a.docResult=result; else a.winResult=result;
 save(); openDetail(id); render();
};
window.removeApp=id=>{if(confirm("이 청약을 삭제할까요?")){data=data.filter(x=>x.id!==id);save();$("#detailDialog").close();render()}};
function showPage(which){
 const cal=which==="calendar";
 $("#calendarPage").classList.toggle("active",cal);$("#overviewPage").classList.toggle("active",!cal);
 $("#calendarTab").classList.toggle("active",cal);$("#overviewTab").classList.toggle("active",!cal);
}
$("#calendarTab").onclick=()=>showPage("calendar");
$("#overviewTab").onclick=()=>showPage("overview");
render();
</script>
</body>
</html>
